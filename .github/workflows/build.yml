name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create GitHub Release'
        required: false
        default: 'false'

permissions:
  contents: write

env:
  SOLUTION_FILE: WebViewApp.sln
  WEBVIEW2_VERSION: "1.0.2903.40"
  WIL_VERSION: "1.0.240803.1"

jobs:
  # ──────────────────────────────────────────────
  # Job 1: Build x86 + x64 executables
  # ──────────────────────────────────────────────
  build:
    name: Build (${{ matrix.platform }})
    runs-on: windows-latest
    strategy:
      matrix:
        platform: [Win32, x64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: packages
          key: nuget-${{ env.WEBVIEW2_VERSION }}-${{ env.WIL_VERSION }}
          restore-keys: nuget-

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2
        with:
          nuget-version: 'latest'

      - name: Restore NuGet packages
        run: nuget restore ${{ env.SOLUTION_FILE }} -PackagesDirectory packages

      - name: Ensure icon exists
        shell: pwsh
        run: |
          if (-not (Test-Path "src\app.ico")) {
            Add-Type -AssemblyName System.Drawing
            $bmp = New-Object System.Drawing.Bitmap(32,32)
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.Clear([System.Drawing.Color]::DodgerBlue)
            $g.Dispose()
            $icon = [System.Drawing.Icon]::FromHandle($bmp.GetHicon())
            $fs = [System.IO.File]::OpenWrite("src\app.ico")
            $icon.Save($fs)
            $fs.Close()
            $bmp.Dispose()
            Write-Host "Created placeholder app.ico"
          }

      - name: Build ${{ matrix.platform }} Release
        run: |
          msbuild ${{ env.SOLUTION_FILE }} `
            /p:Configuration=Release `
            /p:Platform=${{ matrix.platform }} `
            /p:WebView2LoaderPreference=Static `
            /p:WebView2Version=${{ env.WEBVIEW2_VERSION }} `
            /p:WILVersion=${{ env.WIL_VERSION }} `
            /m `
            /v:minimal

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: xstack-${{ matrix.platform }}
          path: bin/${{ matrix.platform }}/Release/xstack.exe
          if-no-files-found: error

  # ──────────────────────────────────────────────
  # Job 2: Publish to GitHub Releases (tag only)
  # ──────────────────────────────────────────────
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Package release zip
        run: |
          mv dist/xstack-Win32/xstack.exe  dist/xstack-x86.exe
          mv dist/xstack-x64/xstack.exe    dist/xstack-x64.exe
          cd dist && zip xstack.zip xstack-x86.exe xstack-x64.exe

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "xstack ${{ github.ref_name }}"
          body: |
            ## xstack ${{ github.ref_name }}

            | File | Description |
            |------|-------------|
            | `xstack-x64.exe` | Portable 64-bit executable |
            | `xstack-x86.exe` | Portable 32-bit executable |
          files: dist/xstack.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
